version: '3.8'

services:
  hendy-test-app:
    build: .
    container_name: hendy_test_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_NAME=hendy-test-project
    networks:
      - hendy-network

networks:
  hendy-network:
    driver: bridge
